name: Tests, Image & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Parallel-Builds desselben Branches abbrechen; Tag-Builds (Releases) nie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Zeitpläne und Tageswerte rechnen in der fachlichen Zeitzone aus den Einstellungen,
        # nicht in der des Servers. Die Matrix hält das fest.
        zeitzone: [Europe/Berlin, UTC, Pacific/Auckland]
    env:
      TZ: ${{ matrix.zeitzone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser-Tests gegen frischen Build (Desktop und Smartphone)
        run: scripts/e2e-local.sh
      - name: Bericht bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  image:
    needs: [tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version bestimmen (Tag muss zu package.json passen)
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$pkg" \
              || { echo "::error::Tag ${GITHUB_REF#refs/tags/} passt nicht zu package.json ($pkg)"; exit 1; }
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image für den Container-Test bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: filum:latest
          build-args: |
            FILUM_VERSION=${{ steps.version.outputs.version }}
      - name: Container-Test (Härtung, Persistenz, Sicherung, Wiederherstellung, Port-Trennung)
        # Derselbe Weg wie in docs/tests.md: docker compose mit docker-compose.yml und eigener Testkonfiguration
        run: scripts/docker-lifecycle-test.sh
      - name: Mit ungültiger Konfiguration darf der Container nicht starten
        run: |
          if timeout 30 docker run --rm -e APP_URL=kaputt filum:latest; then
            echo "::error::Filum ist mit APP_URL=kaputt gestartet"
            exit 1
          fi
      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags & Labels ermitteln
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pbaumfalk/filum
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Image für amd64 und arm64 bauen und pushen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FILUM_VERSION=${{ steps.version.outputs.version }}
            FILUM_SOURCE=https://github.com/${{ github.repository }}

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Abschnitt dieser Version aus CHANGELOG.md
        run: |
          v=${GITHUB_REF#refs/tags/v}
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt für $v"; exit 1; }
      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
